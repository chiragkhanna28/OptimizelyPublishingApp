sections:
  - key: cms_api
    label: CMS REST API
    elements:
      - type: instructions
        text: >-
          In your CMS (SaaS) instance go to Settings > API Keys > Create API Key, and paste its
          Client ID and Client Secret here. The key must have rights to publish content
          (a read-only key cannot see drafts). Publishes are made as this API key, not as the editor: the app cannot check each editor's own CMS publish rights, so any editor who can open the panel can publish the open item's child items. Only direct children of the open item can be published.
      - type: text
        key: clientId
        label: Client ID
        help: Client ID of the CMS API key.
      - type: secret
        key: clientSecret
        label: Client Secret
        help: Client secret of the same API key. Leave blank to keep the saved secret.
      - type: button
        label: Save and test
        action: save
        style: primary
